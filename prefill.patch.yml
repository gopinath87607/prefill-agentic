# Enables the prefill-first workspace snapshot for local runs:
#   pnpm dsh --profile headless --patch engines.patch.yml --patch prefill.patch.yml "task"
#
# Measured against the local Maya server (2026-10-30, deepseek-v4.1-flash):
# - Its tokenizer counts ~3.4 characters per token, so charsPerToken follows
#   the observed ratio instead of the generic default of 4.
# - Cold prompt processing runs at roughly 1,000 tokens/s: a 400k-token
#   baseline needs about 7 minutes once, and the engine keeps the KV resident.
# - Later turns reuse the whole earlier prefix (159,262 of 176,869 tokens on
#   the second turn) and process only newly appended content, at ~430 tokens/s.
# - 400k leaves room under the 800,000-token compaction trigger for the
#   ~150,000-token verbatim tail plus conversation. 700k plus that tail
#   exceeds the trigger, so the snapshot is re-injected into compaction churn.
- id: prefill-context
  name: '@deepseek-ai/dsh-prefill-context'
  disabled: false
  config:
    budgetTokens: 400000
    deltaBudgetTokens: 16000
    charsPerToken: 3.4
    # One file larger than this is skipped by estimated tokens, so a generated
    # fixture cannot consume the whole baseline.
    maxFileTokens: 32000
    # Names of skipped files stay usable through the read tool without paying
    # their contents in the snapshot. The index is additional to budgetTokens.
    includePathIndex: true
    indexBudgetTokens: 8000
    # .gitignore layers keep build output and vendored copies out unless a
    # nested file re-includes them.
    respectGitignore: true
    # Put the baseline ahead of the first prompt and keep the newest user
    # message last in the request.
    position: before
    # Subagents get their own narrow tasks; repeating the 400k baseline in
    # every delegation would multiply cold prefills. They still read files
    # with their tools.
    agents: main
    guidance: true
    # Cached prefill tokens are converted to saved time at the measured cold
    # prompt rate, not the ~430 tokens/s append rate: reuse avoids the cold
    # processing of the prefix it serves.
    promptTokensPerSecond: 1000
    # A configured list replaces the built-in defaults rather than extending
    # them, so the defaults are repeated here; append workspace-specific
    # patterns at the end. Keep this list in sync with
    # DEFAULT_EXCLUDED_FILE_PATTERNS in src/config.ts.
    excludedFilePatterns:
      - '.env*'
      - '!.env.example'
      - '*.pem'
      - '*.key'
      - '*.p12'
      - '*.pfx'
      - '*.lock'
      - '*-lock.json'
      - '*-lock.yaml'
      - 'npm-shrinkwrap.json'
      - '*.min.js'
      - '*.min.css'
      - '*.map'
      - '*.generated.*'
